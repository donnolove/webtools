<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>節日賀卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --sky:#d9f1ff;
      --ink:#5b3a5e;
      --ink-soft:#9a7d9c;
      --pink:#ff8fb8;   --pink-d:#e8699a;
      --lilac:#b9a2ff;  --lilac-d:#957ae8;
      --blue:#7fd0ff;   --blue-d:#52b3ea;
      --lemon:#ffd76a;  --lemon-d:#efb93a;
      --peach:#ffb08a;  --peach-d:#ee8d62;
      --mint:#84e0b2;   --mint-d:#56c692;
      --shadow-soft: 0 10px 24px rgba(91,58,94,.14);
      --font: "Chiron GoRound TC", ui-rounded, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      overflow:hidden;
      font-family:var(--font);
      color:var(--ink);
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(70px 30px at 10% 16%, #fff 98%, transparent),
        radial-gradient(50px 24px at 14% 13%, #fff 98%, transparent),
        radial-gradient(80px 32px at 90% 90%, rgba(255,255,255,.85) 98%, transparent),
        radial-gradient(52px 24px at 86% 87%, rgba(255,255,255,.85) 98%, transparent),
        linear-gradient(180deg, var(--sky) 0%, #eaf7ff 100%);
    }

    button{ font:inherit; color:inherit; }

    .app{
      height:100vh;
      height:100dvh;
      max-width:1400px;
      margin:0 auto;
      padding:16px;
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      grid-template-rows:auto minmax(0, 1fr) auto;
      gap:14px;
    }

    /* 上方工具列 */
    .bar{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .bar .spacer{ flex:1; }

    .gummy{
      --c:var(--pink); --d:var(--pink-d);
      width:68px; height:64px;
      border:0;
      border-radius:22px;
      background: linear-gradient(to bottom, rgba(255,255,255,.38), rgba(255,255,255,0) 50%), var(--c);
      box-shadow: 0 5px 0 var(--d), 0 10px 16px rgba(91,58,94,.12);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
      cursor:pointer;
      user-select:none;
      touch-action:manipulation;
      transition: transform 80ms ease, box-shadow 80ms ease, opacity 150ms ease;
    }
    .gummy i{ font-style:normal; font-family:var(--emoji); font-size:26px; line-height:1; }
    .gummy small{ font-size:11px; font-weight:800; letter-spacing:.05em; }
    .gummy:active{
      transform:translateY(4px);
      box-shadow: 0 1px 0 var(--d), 0 4px 8px rgba(91,58,94,.12);
    }
    .gummy.pink{ --c:var(--pink); --d:var(--pink-d); }
    .gummy.lilac{ --c:var(--lilac); --d:var(--lilac-d); }
    .gummy.blue{ --c:var(--blue); --d:var(--blue-d); }
    .gummy.lemon{ --c:var(--lemon); --d:var(--lemon-d); }
    .gummy.peach{ --c:var(--peach); --d:var(--peach-d); }
    .gummy.mint{ --c:var(--mint); --d:var(--mint-d); }
    .gummy[aria-pressed="false"]{ --c:#e7eef3; --d:#cbd6de; color:var(--ink-soft); }
    .gummy:disabled{ opacity:.45; cursor:default; transform:none; box-shadow: 0 5px 0 var(--d); }

    .gummy:focus-visible,
    .swatch:focus-visible,
    .tab:focus-visible,
    .sticker-btn:focus-visible,
    .pop button:focus-visible,
    .pen:focus-visible{
      outline:3px solid var(--lilac-d);
      outline-offset:3px;
    }

    .swatches{
      display:flex;
      gap:8px;
      padding:8px 10px;
      background:rgba(255,255,255,.7);
      border-radius:999px;
    }
    .swatch{
      width:40px; height:40px;
      border:0;
      border-radius:50%;
      cursor:pointer;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.08);
      touch-action:manipulation;
    }
    .swatch[aria-checked="true"]{ box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--pink); }
    .swatch[data-bg="pinkBlue"]{ background:linear-gradient(135deg,#ffd3e6,#cfeeff); }
    .swatch[data-bg="warmGold"]{ background:linear-gradient(135deg,#ffe7a8,#ffc2a8); }
    .swatch[data-bg="mintCandy"]{ background:linear-gradient(135deg,#c9f5e1,#ffd9ec); }
    .swatch[data-bg="nightStar"]{ background:linear-gradient(135deg,#3b3f8f,#8a6cf0); }

    /* 賀卡 */
    .stage-wrap{
      container-type:size;
      display:grid;
      place-items:center;
      min-height:0;
    }

    .card{
      --c1:#ffd3e6; --c2:#cfeeff; --glow:.9;
      position:relative;
      width:min(100cqw, 150cqh);
      aspect-ratio:3 / 2;
      container-type:inline-size;
      border:6px solid #fff;
      border-radius:30px;
      overflow:hidden;
      box-shadow: 0 14px 30px rgba(91,58,94,.14);
      background:
        radial-gradient(56% 56% at 25% 20%, rgba(255,255,255,var(--glow)), transparent),
        linear-gradient(135deg, var(--c1), var(--c2));
    }
    .card[data-bg="warmGold"]{ --c1:#ffe7a8; --c2:#ffc2a8; }
    .card[data-bg="mintCandy"]{ --c1:#c9f5e1; --c2:#ffd9ec; }
    .card[data-bg="nightStar"]{ --c1:#3b3f8f; --c2:#8a6cf0; --glow:.18; }

    .title-block{
      position:absolute;
      top:3%; left:2.5%;
      z-index:2;
      max-width:66%;
      padding:1.4cqw 2.2cqw 1.6cqw;
      background:rgba(255,255,255,.85);
      border-radius:2.8cqw;
      box-shadow: 0 4px 0 rgba(255,143,184,.25);
    }
    .card-title,
    .card-wish{
      display:block;
      outline:none;
      border-radius:8px;
      overflow-wrap:anywhere;
      line-height:1.3;
    }
    .card-title{
      font-size:max(16px, 3cqw);
      font-weight:800;
    }
    .card-wish{
      margin-top:.4cqw;
      font-size:max(12px, 1.9cqw);
      font-weight:600;
      color:var(--ink-soft);
    }
    .card-title:focus,
    .card-wish:focus{ background:#fff3f8; box-shadow:0 0 0 4px #fff3f8; }

    .pen{
      position:absolute;
      top:-12px; right:-12px;
      width:34px; height:34px;
      border:0;
      border-radius:50%;
      background:var(--lemon);
      box-shadow:0 3px 0 var(--lemon-d);
      display:grid; place-items:center;
      font-family:var(--emoji);
      font-size:15px;
      cursor:pointer;
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:3;
      pointer-events:none;
    }

    /* 放到卡片上的貼紙 */
    .item{
      position:absolute;
      pointer-events:auto;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
      line-height:1;
      filter: drop-shadow(0 6px 6px rgba(91,58,94,.18));
    }
    .item:active{ cursor:grabbing; }
    .item .inner{ display:block; }
    .item .emoji{ font-family:var(--emoji); font-size:7cqw; display:block; }
    .item .shape{ display:block; width:11cqw; height:11cqw; }
    .item .shape svg{ display:block; width:100%; height:100%; }
    .item.selected{
      outline:3px dashed var(--pink);
      outline-offset:8px;
      border-radius:14px;
    }
    .item.pop-in .inner{ animation: pop-in 380ms cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes pop-in{
      from{ transform:scale(.2); opacity:0; }
      to{ transform:scale(1); opacity:1; }
    }

    .hint{
      position:absolute;
      left:50%; bottom:3%;
      z-index:2;
      font-family:var(--emoji);
      font-size:6cqw;
      pointer-events:none;
      filter: drop-shadow(0 6px 6px rgba(91,58,94,.2));
      animation: bob 1.1s ease-in-out infinite;
    }
    .hint[hidden]{ display:none; }
    @keyframes bob{
      0%, 100%{ transform:translate(-50%, 0); }
      50%{ transform:translate(-50%, 12px); }
    }

    /* 選取貼紙的小工具列 */
    .pop{
      --arrow-x:50%;
      position:absolute;
      z-index:1000;
      display:none;
      gap:8px;
      padding:8px;
      background:#fff;
      border-radius:24px;
      box-shadow: var(--shadow-soft);
    }
    .pop.show{ display:flex; }
    .pop::before{
      content:"";
      position:absolute;
      top:-7px; left:var(--arrow-x);
      width:16px; height:16px;
      background:#fff;
      border-radius:3px;
      transform:translateX(-50%) rotate(45deg);
    }
    .pop.above::before{ top:auto; bottom:-7px; }
    .pop button{
      position:relative;
      width:50px; height:50px;
      border:0;
      border-radius:16px;
      display:grid; place-items:center;
      font-family:var(--emoji);
      font-size:22px;
      cursor:pointer;
      touch-action:manipulation;
      transition: transform 80ms ease;
    }
    .pop button:active{ transform:scale(.9); }
    .pop .p-delete{ background:#ffe1ea; }
    .pop .p-rotate{ background:#e6ddff; }
    .pop .p-bigger{ background:#dcf5e8; }
    .pop .p-smaller{ background:#dff2ff; }

    /* 下方貼紙托盤 */
    .tray{
      display:flex;
      gap:12px;
      height:156px;
    }
    .tabs{
      display:grid;
      grid-template-columns:repeat(2, 60px);
      gap:6px;
    }
    .tab{
      border:0;
      border-radius:18px;
      background:rgba(255,255,255,.7);
      font-family:var(--emoji);
      font-size:26px;
      cursor:pointer;
      touch-action:manipulation;
    }
    .tab[aria-selected="true"]{ background:var(--pink); box-shadow:0 4px 0 var(--pink-d); }

    .sticker-panel{
      position:relative;
      flex:1;
      min-width:0;
      background:#fff;
      border-radius:26px;
      box-shadow: 0 8px 20px rgba(91,58,94,.1);
      overflow:hidden;
    }
    .sticker-panel::after{
      content:"";
      position:absolute;
      top:0; right:0; bottom:0;
      width:56px;
      background:linear-gradient(to right, rgba(255,255,255,0), #fff);
      pointer-events:none;
    }
    .sticker-list{
      height:100%;
      display:grid;
      grid-auto-flow:column;
      grid-template-rows:repeat(2, 1fr);
      grid-auto-columns:70px;
      gap:8px;
      padding:10px 56px 10px 10px;
      overflow-x:auto;
      overflow-y:hidden;
      overscroll-behavior-x:contain;
      scrollbar-width:none;
      touch-action:pan-x;
    }
    .sticker-list::-webkit-scrollbar{ display:none; }
    .sticker-btn{
      border:0;
      border-radius:18px;
      background:#fff6fa;
      box-shadow: inset 0 -3px 0 #ffe1ee;
      display:grid; place-items:center;
      font-family:var(--emoji);
      font-size:36px;
      cursor:pointer;
      touch-action:pan-x;
      transition: transform 80ms ease;
    }
    .sticker-btn:active{ transform:scale(.9); }
    .sticker-btn svg{ width:44px; height:44px; }

    /* 雪花與彩紙 */
    .snow-layer{
      position:fixed;
      inset:0;
      z-index:50;
      pointer-events:none;
      overflow:hidden;
    }
    .flake{
      position:absolute;
      top:-10vh;
      will-change:transform;
    }
    .confetti{
      position:fixed;
      z-index:80;
      border-radius:4px;
      pointer-events:none;
    }

    /* 平板直向：托盤多一排 */
    @media (orientation: portrait) and (min-height: 900px){
      .tray{ height:250px; }
      .tabs{ grid-template-columns:66px; }
      .sticker-list{ grid-template-rows:repeat(3, 1fr); }
    }

    /* 小螢幕 */
    @media (max-width: 700px){
      .app{ padding:10px; gap:10px; }
      .gummy{ width:52px; height:52px; border-radius:18px; }
      .gummy i{ font-size:20px; }
      .gummy small{ font-size:10px; }
      .swatch{ width:30px; height:30px; }
      .tray{ height:140px; }
      .tabs{ grid-template-columns:48px; }
      .tab{ font-size:20px; }
      .sticker-list{ grid-auto-columns:60px; }
      .sticker-btn{ font-size:30px; }
    }

    @media (prefers-reduced-motion: reduce){
      .item.pop-in .inner, .hint{ animation:none; }
      .gummy, .sticker-btn, .pop button{ transition:none; }
    }
  </style>
</head>
<body>
  <div class="snow-layer" id="snowLayer" aria-hidden="true"></div>

  <div class="app">
    <header class="bar">
      <button class="gummy pink" id="btnCelebrate" type="button"><i aria-hidden="true">🎉</i><small>煙火</small></button>
      <button class="gummy lilac" id="btnShuffle" type="button"><i aria-hidden="true">🪄</i><small>驚喜</small></button>
      <button class="gummy blue" id="btnSnow" type="button" aria-pressed="true"><i aria-hidden="true">❄️</i><small>雪花</small></button>
      <div class="swatches" role="radiogroup" aria-label="卡片背景">
        <button class="swatch" type="button" role="radio" data-bg="pinkBlue" aria-label="粉紅天空" aria-checked="true"></button>
        <button class="swatch" type="button" role="radio" data-bg="warmGold" aria-label="暖橘" aria-checked="false"></button>
        <button class="swatch" type="button" role="radio" data-bg="mintCandy" aria-label="薄荷糖" aria-checked="false"></button>
        <button class="swatch" type="button" role="radio" data-bg="nightStar" aria-label="夜空" aria-checked="false"></button>
      </div>
      <span class="spacer"></span>
      <button class="gummy lemon" id="btnUndo" type="button" disabled><i aria-hidden="true">↩️</i><small>復原</small></button>
      <button class="gummy peach" id="btnClear" type="button"><i aria-hidden="true">🧹</i><small>清空</small></button>
      <button class="gummy mint" id="btnSave" type="button"><i aria-hidden="true">📷</i><small>存圖</small></button>
    </header>

    <main class="stage-wrap">
      <div class="card" id="card" data-bg="pinkBlue">
        <div class="title-block" id="titleBlock">
          <span class="card-title" id="cardTitle" contenteditable="true" spellcheck="false" role="textbox" aria-label="卡片標題">暖呼呼的節日賀卡 🎄</span>
          <span class="card-wish" id="cardWish" contenteditable="true" spellcheck="false" role="textbox" aria-label="祝福文字">祝你節日快樂！每天都像糖果一樣甜～</span>
          <button class="pen" id="btnPen" type="button" aria-label="修改文字">✏️</button>
        </div>
        <div class="stage" id="stage"></div>
        <span class="hint" id="hint" aria-hidden="true" hidden>👇</span>
        <div class="pop" id="pop" role="toolbar" aria-label="貼紙工具">
          <button class="p-delete" id="btnDelete" type="button" aria-label="刪除貼紙">🗑️</button>
          <button class="p-rotate" id="btnRotate" type="button" aria-label="旋轉貼紙">🔄</button>
          <button class="p-bigger" id="btnBigger" type="button" aria-label="放大貼紙">➕</button>
          <button class="p-smaller" id="btnSmaller" type="button" aria-label="縮小貼紙">➖</button>
        </div>
      </div>
    </main>

    <footer class="tray">
      <div class="tabs" role="tablist" aria-label="貼紙種類">
        <button class="tab" type="button" role="tab" data-group="cute" aria-label="甜甜裝飾" aria-selected="true">🎀</button>
        <button class="tab" type="button" role="tab" data-group="sparkle" aria-label="亮晶晶" aria-selected="false">🌟</button>
        <button class="tab" type="button" role="tab" data-group="holiday" aria-label="節日角色" aria-selected="false">🎅</button>
        <button class="tab" type="button" role="tab" data-group="shapes" aria-label="形狀貼紙" aria-selected="false">💗</button>
      </div>
      <div class="sticker-panel">
        <div class="sticker-list" id="stickerList" role="tabpanel"></div>
      </div>
    </footer>
  </div>

<script>
/* ---------------------------
   0) 小小音效引擎（Web Audio）
---------------------------- */
const SFX = (() => {
  let ctx = null;
  let unlocked = false;

  function ensure(){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  function unlock(){
    try{
      ensure();
      if(ctx.state === "suspended") ctx.resume();
      unlocked = true;
    }catch(e){}
  }

  // 可愛的「啵」(drop)
  function pop(){
    if(!unlocked) unlock();
    const c = ensure();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(520, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(980, c.currentTime + 0.08);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, c.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.12);
    o.connect(g).connect(c.destination);
    o.start();
    o.stop(c.currentTime + 0.13);
  }

  // 閃亮聲 (select)
  function twinkle(){
    if(!unlocked) unlock();
    const c = ensure();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(1200, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(600, c.currentTime + 0.12);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, c.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.18);
    o.connect(g).connect(c.destination);
    o.start();
    o.stop(c.currentTime + 0.2);
  }

  // 煙火聲（噗沙沙）
  function firework(){
    if(!unlocked) unlock();
    const c = ensure();
    const bufferSize = 2 * c.sampleRate;
    const noiseBuffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = (Math.random() * 2 - 1);

    const noise = c.createBufferSource();
    noise.buffer = noiseBuffer;

    const bp = c.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(1400, c.currentTime);
    bp.Q.setValueAtTime(0.8, c.currentTime);

    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.35);

    noise.connect(bp).connect(g).connect(c.destination);
    noise.start();
    noise.stop(c.currentTime + 0.36);
  }

  // 搖一搖的魔法聲
  function magic(){
    if(!unlocked) unlock();
    const c = ensure();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(260, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(1040, c.currentTime + 0.22);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, c.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.28);
    o.connect(g).connect(c.destination);
    o.start();
    o.stop(c.currentTime + 0.3);
  }

  return { unlock, pop, twinkle, firework, magic };
})();

/* ---------------------------
   1) 貼紙庫資料
---------------------------- */
const STICKERS = {
  cute: ["🎀","🍭","🍬","🧁","🍰","🍩","🍪","🫧","🌈","🧸","🧋","🍓","🍒","🍎","🍉","🍌","🍍","🥨","🥞","🧇","🫶","💗","💖","💝","💞"],
  sparkle: ["✨","🌟","⭐","💫","🎇","🎆","🪩","🔔","🎈","🎉","🧡","💛","💚","💙","💜","🤍","🩷","🩵","🩶","🧿","🌙","☁️","🫰"],
  holiday: ["🎄","🎁","🎅","🤶","🦌","⛄","🧤","🧣","🧦","🥛","🍫","🕊️","🎶","📯","🕯️","🍊","🌰","🍯"],
  shapes: ["shape:heart","shape:star","shape:ribbon","shape:confetti","shape:snowman","shape:cookie"]
};
const ALL_STICKERS = [].concat(STICKERS.cute, STICKERS.sparkle, STICKERS.holiday, STICKERS.shapes);
const SHAPE_COLORS_1 = ["#ff5aa5","#4dd4ff","#ffb703","#7c4dff","#2dd4bf","#fb7185"];
const SHAPE_COLORS_2 = ["#ffe066","#ffd6e7","#b8f2ff","#d6c7ff","#c7ffd8","#ffffff"];

const card = document.getElementById("card");
const stage = document.getElementById("stage");
const hint = document.getElementById("hint");
const pop = document.getElementById("pop");
const cardTitle = document.getElementById("cardTitle");
const cardWish = document.getElementById("cardWish");
const stickerList = document.getElementById("stickerList");
const btnUndo = document.getElementById("btnUndo");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------------------
   2) 貼紙托盤：分類切換、點一下放到卡片、電腦可拖放
---------------------------- */
function renderTray(group){
  stickerList.innerHTML = "";
  STICKERS[group].forEach((code) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sticker-btn";
    btn.draggable = true;
    btn.dataset.code = code;

    if(code.startsWith("shape:")){
      btn.setAttribute("aria-label", "形狀貼紙");
      btn.appendChild(makeShapeSvg(code.split(":")[1], "#ff8fb8", "#ffe066", 7));
    }else{
      btn.setAttribute("aria-label", "貼紙 " + code);
      btn.textContent = code;
    }

    btn.addEventListener("click", () => {
      SFX.unlock();
      pushUndo();
      const spot = findFreeSpot();
      const it = addItem(newItemData(code, spot.x, spot.y), true);
      selectItem(it);
      SFX.pop();
    });

    btn.addEventListener("dragstart", (e) => {
      SFX.unlock();
      SFX.twinkle();
      e.dataTransfer.setData("text/plain", code);
      e.dataTransfer.effectAllowed = "copy";
    });

    stickerList.appendChild(btn);
  });
  stickerList.scrollLeft = 0;
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    SFX.unlock(); SFX.twinkle();
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t === tab)));
    renderTray(tab.dataset.group);
  });
});

card.addEventListener("dragover", (e) => e.preventDefault());
card.addEventListener("drop", (e) => {
  e.preventDefault();
  const code = e.dataTransfer.getData("text/plain");
  if(!ALL_STICKERS.includes(code)) return;
  SFX.unlock();
  pushUndo();
  const p = toStagePercent(e.clientX, e.clientY);
  const it = addItem(newItemData(code, p.x, p.y), true);
  selectItem(it);
  SFX.pop();
});

// 找一個離其他貼紙和標題比較遠的位置
function findFreeSpot(){
  const titleRect = document.getElementById("titleBlock").getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const titleBox = {
    x2: (titleRect.right - stageRect.left) / stageRect.width * 100,
    y2: (titleRect.bottom - stageRect.top) / stageRect.height * 100
  };
  let best = null, bestScore = -1;
  for(let i = 0; i < 16; i++){
    const x = rand(10, 90), y = rand(18, 88);
    if(x < titleBox.x2 + 4 && y < titleBox.y2 + 6) continue;
    let score = 100;
    items.forEach(it => {
      const d = Math.hypot((it.x - x) * 1.5, it.y - y);
      score = Math.min(score, d);
    });
    if(score > bestScore){ bestScore = score; best = { x, y }; }
  }
  return best || { x: 50, y: 60 };
}

/* ---------------------------
   3) 卡片上的貼紙：資料與畫面
---------------------------- */
let items = [];
let selected = null;
let zCounter = 10;

function newItemData(code, x, y){
  return {
    code, x, y,
    s: +rand(0.9, 1.2).toFixed(3),
    r: +rand(-15, 15).toFixed(2),
    c1: pick(SHAPE_COLORS_1),
    c2: pick(SHAPE_COLORS_2),
    seed: Math.floor(Math.random() * 1e6)
  };
}

function addItem(data, animate){
  const it = Object.assign({ z: ++zCounter }, data);
  zCounter = Math.max(zCounter, it.z);

  const el = document.createElement("div");
  el.className = "item" + (animate && !reduceMotion ? " pop-in" : "");
  const inner = document.createElement("span");
  inner.className = "inner";

  if(it.code.startsWith("shape:")){
    const wrap = document.createElement("span");
    wrap.className = "shape";
    wrap.appendChild(makeShapeSvg(it.code.split(":")[1], it.c1, it.c2, it.seed));
    inner.appendChild(wrap);
  }else{
    const span = document.createElement("span");
    span.className = "emoji";
    span.textContent = it.code;
    inner.appendChild(span);
  }
  el.appendChild(inner);
  it.el = el;

  el.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    SFX.unlock();
    selectItem(it);
    startDragItem(it, e);
  });

  applyItem(it);
  stage.appendChild(el);
  items.push(it);
  syncUi();
  return it;
}

function applyItem(it){
  it.el.style.left = it.x + "%";
  it.el.style.top = it.y + "%";
  it.el.style.zIndex = String(it.z);
  it.el.style.transform = `translate(-50%, -50%) rotate(${it.r}deg) scale(${it.s})`;
}

function removeItem(it){
  it.el.remove();
  items = items.filter(x => x !== it);
  if(selected === it) selectItem(null);
  syncUi();
}

function clearItems(){
  items.forEach(it => it.el.remove());
  items = [];
  selectItem(null);
  syncUi();
}

function makeShapeSvg(name, color1, color2, seed){
  // 用 SVG 做可愛形狀（不依賴外部圖）；seed 讓復原與存圖時長得一樣
  const random = seededRandom(seed);
  const between = (a, b) => random() * (b - a) + a;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox","0 0 120 120");

  const defs = document.createElementNS(svg.namespaceURI, "defs");
  const lg = document.createElementNS(svg.namespaceURI, "linearGradient");
  lg.setAttribute("id","g"+Math.random().toString(16).slice(2));
  lg.setAttribute("x1","0"); lg.setAttribute("y1","0");
  lg.setAttribute("x2","1"); lg.setAttribute("y2","1");

  const s1 = document.createElementNS(svg.namespaceURI, "stop");
  s1.setAttribute("offset","0%");
  s1.setAttribute("stop-color", color1);

  const s2 = document.createElementNS(svg.namespaceURI, "stop");
  s2.setAttribute("offset","100%");
  s2.setAttribute("stop-color", color2);

  lg.appendChild(s1); lg.appendChild(s2);
  defs.appendChild(lg);
  svg.appendChild(defs);

  const stroke = "rgba(255,255,255,.85)";

  function path(d){
    const p = document.createElementNS(svg.namespaceURI, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", `url(#${lg.id})`);
    p.setAttribute("stroke", stroke);
    p.setAttribute("stroke-width","4");
    p.setAttribute("stroke-linejoin","round");
    return p;
  }

  function dot(cx, cy, r, fill){
    const c = document.createElementNS(svg.namespaceURI, "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r); c.setAttribute("fill", fill);
    return c;
  }

  if(name==="heart"){
    svg.appendChild(path("M60 103 C18 78, 10 48, 28 32 C40 20, 54 24, 60 35 C66 24, 80 20, 92 32 C110 48, 102 78, 60 103 Z"));
  } else if(name==="star"){
    svg.appendChild(path("M60 10 L73 45 L110 45 L80 68 L92 105 L60 84 L28 105 L40 68 L10 45 L47 45 Z"));
  } else if(name==="ribbon"){
    svg.appendChild(path("M20 40 C35 20, 55 20, 60 38 C65 20, 85 20, 100 40 C85 55, 70 60, 60 52 C50 60, 35 55, 20 40 Z"));
    svg.appendChild(path("M48 58 L30 110 L60 90 L90 110 L72 58 Z"));
  } else if(name==="confetti"){
    svg.appendChild(path("M15 75 C25 30, 55 25, 75 35 C95 45, 105 70, 98 90 C85 105, 60 110, 38 102 C22 96, 12 90, 15 75 Z"));
    for(let i=0;i<10;i++) svg.appendChild(dot(between(30, 90), between(40, 95), between(3, 6), "rgba(255,255,255,.9)"));
  } else if(name==="snowman"){
    svg.appendChild(path("M60 18 C45 18, 34 29, 34 42 C34 52, 40 60, 48 63 C40 70, 34 80, 34 92 C34 106, 45 114, 60 114 C75 114, 86 106, 86 92 C86 80, 80 70, 72 63 C80 60, 86 52, 86 42 C86 29, 75 18, 60 18 Z"));
    svg.appendChild(dot(52, 40, 4, "#5b3a5e"));
    svg.appendChild(dot(68, 40, 4, "#5b3a5e"));
  } else if(name==="cookie"){
    svg.appendChild(path("M60 15 C35 15, 15 35, 15 60 C15 85, 35 105, 60 105 C85 105, 105 85, 105 60 C105 35, 85 15, 60 15 Z"));
    for(let i=0;i<10;i++) svg.appendChild(dot(between(30, 90), between(30, 90), between(3, 7), "rgba(91,58,94,.35)"));
  } else {
    svg.appendChild(path("M60 18 C35 18, 18 35, 18 60 C18 85, 35 102, 60 102 C85 102, 102 85, 102 60 C102 35, 85 18, 60 18 Z"));
  }

  return svg;
}

/* ---------------------------
   4) 拖動貼紙（Pointer Events）
---------------------------- */
function startDragItem(it, e){
  const el = it.el;
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  const rect = stage.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  const itemX = it.x, itemY = it.y;
  let moved = false;

  SFX.twinkle();

  function onMove(ev){
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if(!moved){
      if(Math.hypot(dx, dy) < 4) return;
      moved = true;
      pushUndo();
      hidePop();
    }
    it.x = clamp(itemX + dx / rect.width * 100, 0, 100);
    it.y = clamp(itemY + dy / rect.height * 100, 0, 100);
    applyItem(it);
  }
  function onUp(){
    el.removeEventListener("pointermove", onMove);
    el.removeEventListener("pointerup", onUp);
    el.removeEventListener("pointercancel", onUp);
    if(moved){
      SFX.pop();
      showPop();
    }
  }

  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", onUp);
}

// 點卡片空白處取消選取
card.addEventListener("pointerdown", (e) => {
  if(e.target === card || e.target === stage) selectItem(null);
});

function selectItem(it){
  if(selected) selected.el.classList.remove("selected");
  selected = it;
  if(selected){
    selected.z = ++zCounter;
    applyItem(selected);
    selected.el.classList.add("selected");
    showPop();
  }else{
    hidePop();
  }
}

/* ---------------------------
   5) 選取貼紙的小工具列：刪除、旋轉、放大、縮小
---------------------------- */
function showPop(){
  if(!selected) return;
  pop.classList.add("show");
  const cardRect = card.getBoundingClientRect();
  const itemRect = selected.el.getBoundingClientRect();
  const border = card.clientLeft;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const innerW = card.clientWidth, innerH = card.clientHeight;
  const centerX = itemRect.left + itemRect.width / 2 - cardRect.left - border;

  let top = itemRect.bottom - cardRect.top - border + 16;
  let above = false;
  if(top + h > innerH - 8){
    top = itemRect.top - cardRect.top - border - h - 16;
    above = true;
  }
  top = clamp(top, 8, innerH - h - 8);
  const left = clamp(centerX - w / 2, 8, innerW - w - 8);

  pop.style.left = left + "px";
  pop.style.top = top + "px";
  pop.style.setProperty("--arrow-x", clamp(centerX - left, 24, w - 24) + "px");
  pop.classList.toggle("above", above);
}

function hidePop(){
  pop.classList.remove("show");
}

/* ---------------------------
   6) 復原（最多 30 步）
---------------------------- */
const undoStack = [];
const UNDO_LIMIT = 30;

function snapshot(){
  return JSON.stringify({
    bg: card.dataset.bg,
    title: cardTitle.textContent,
    wish: cardWish.textContent,
    items: items.map(({ el, ...data }) => data)
  });
}

function pushUndo(state){
  undoStack.push(state || snapshot());
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
  syncUi();
}

function restore(json){
  const state = JSON.parse(json);
  clearItems();
  setBackground(state.bg);
  cardTitle.textContent = state.title;
  cardWish.textContent = state.wish;
  state.items
    .sort((a, b) => a.z - b.z)
    .forEach(data => addItem(data, false));
}

btnUndo.addEventListener("click", () => {
  if(!undoStack.length) return;
  SFX.unlock(); SFX.magic();
  restore(undoStack.pop());
  syncUi();
});

function syncUi(){
  btnUndo.disabled = undoStack.length === 0;
  hint.hidden = items.length > 0;
}

/* ---------------------------
   7) 卡片文字：直接點字修改
---------------------------- */
const DEFAULT_TEXT = new Map([
  [cardTitle, "暖呼呼的節日賀卡 🎄"],
  [cardWish, "祝你節日快樂！"]
]);

[cardTitle, cardWish].forEach((el) => {
  let before = null;
  let textBefore = "";

  el.addEventListener("focus", () => {
    before = snapshot();
    textBefore = el.textContent;
    selectItem(null);
  });
  el.addEventListener("blur", () => {
    const text = el.textContent.replace(/\s+/g, " ").trim();
    el.textContent = text || DEFAULT_TEXT.get(el);
    if(el.textContent !== textBefore) pushUndo(before);
  });
  el.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      el.blur();
    }
  });
  // 貼上時只留純文字
  el.addEventListener("paste", (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
    document.execCommand("insertText", false, text);
  });
});

/* ---------------------------
   10) 存成圖片（用 canvas 重畫卡片，不含選取框與工具列）
---------------------------- */
const BG_COLORS = {
  pinkBlue: ["#ffd3e6", "#cfeeff", 0.9],
  warmGold: ["#ffe7a8", "#ffc2a8", 0.9],
  mintCandy: ["#c9f5e1", "#ffd9ec", 0.9],
  nightStar: ["#3b3f8f", "#8a6cf0", 0.18]
};

document.getElementById("btnSave").addEventListener("click", async () => {
  SFX.unlock(); SFX.twinkle();
  if(document.activeElement && document.activeElement.isContentEditable) document.activeElement.blur();
  try{
    const blob = await renderCardImage();
    const a = document.createElement("a");
    const now = new Date();
    const stamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0")
      + "-" + String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0");
    a.href = URL.createObjectURL(blob);
    a.download = `賀卡-${stamp}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    burstConfetti(16);
  }catch(err){
    console.error(err);
    alert("存圖失敗了，請再按一次「存圖」。");
  }
});

async function renderCardImage(){
  await document.fonts.ready;
  const cardRect = card.getBoundingClientRect();
  const k = 1500 / cardRect.width;
  const W = Math.round(cardRect.width * k), H = Math.round(cardRect.height * k);
  const border = card.clientLeft * k;
  const radius = 30 * k;

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // 白色卡紙邊框（圓角外也填白，避免傳到通訊軟體時透明處變黑）
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  // 背景
  ctx.save();
  roundRect(ctx, border, border, W - border * 2, H - border * 2, radius - border);
  ctx.clip();
  const [c1, c2, glow] = BG_COLORS[card.dataset.bg] || BG_COLORS.pinkBlue;
  const lg = ctx.createLinearGradient(0, 0, W, H);
  lg.addColorStop(0, c1);
  lg.addColorStop(1, c2);
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W * 0.25, H * 0.2, 0, W * 0.25, H * 0.2, W * 0.56);
  rg.addColorStop(0, `rgba(255,255,255,${glow})`);
  rg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  // 標題區塊
  const rel = (r) => ({
    x: (r.left - cardRect.left) * k,
    y: (r.top - cardRect.top) * k,
    w: r.width * k,
    h: r.height * k
  });
  const tb = document.getElementById("titleBlock");
  const tbBox = rel(tb.getBoundingClientRect());
  ctx.save();
  ctx.shadowColor = "rgba(255,143,184,.25)";
  ctx.shadowOffsetY = 4 * k;
  roundRect(ctx, tbBox.x, tbBox.y, tbBox.w, tbBox.h, parseFloat(getComputedStyle(tb).borderTopLeftRadius) * k);
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fill();
  ctx.restore();
  drawText(ctx, cardTitle, rel(cardTitle.getBoundingClientRect()), k);
  drawText(ctx, cardWish, rel(cardWish.getBoundingClientRect()), k);

  // 貼紙（依圖層順序）
  const sorted = items.slice().sort((a, b) => a.z - b.z);
  for(const it of sorted){
    const r = it.el.getBoundingClientRect();
    const cx = (r.left + r.width / 2 - cardRect.left) * k;
    const cy = (r.top + r.height / 2 - cardRect.top) * k;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(it.r * Math.PI / 180);
    ctx.scale(it.s, it.s);
    ctx.shadowColor = "rgba(91,58,94,.18)";
    ctx.shadowBlur = 6 * k;
    ctx.shadowOffsetY = 6 * k;
    if(it.code.startsWith("shape:")){
      const svg = it.el.querySelector("svg");
      const size = parseFloat(getComputedStyle(svg).width) * k;
      const img = await loadSvgImage(svg);
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
    }else{
      const emoji = it.el.querySelector(".emoji");
      const fs = parseFloat(getComputedStyle(emoji).fontSize) * k;
      ctx.font = `${fs}px ${getComputedStyle(emoji).fontFamily}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(it.code, 0, fs * 0.04);
    }
    ctx.restore();
  }
  ctx.restore();

  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("toBlob failed")), "image/png");
  });
}

function drawText(ctx, el, box, k){
  const cs = getComputedStyle(el);
  const fs = parseFloat(cs.fontSize) * k;
  const lineHeight = fs * 1.3;
  ctx.font = `${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
  ctx.fillStyle = cs.color;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";

  // 依元素寬度逐字換行
  const lines = [];
  let line = "";
  for(const ch of Array.from(el.textContent)){
    if(ctx.measureText(line + ch).width > box.w + 1 && line){
      lines.push(line);
      line = ch;
    }else{
      line += ch;
    }
  }
  if(line) lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, box.x, box.y + lineHeight * (i + 0.5)));
}

function loadSvgImage(svg){
  return new Promise((resolve, reject) => {
    const xml = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  });
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------------------
   11) 彩紙動畫
---------------------------- */
function burstConfetti(count){
  const rect = card.getBoundingClientRect();
  const colors = ["#ff8fb8","#b9a2ff","#7fd0ff","#ffd76a","#ffb08a","#84e0b2"];
  for(let i=0;i<count;i++){
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.width = rand(8, 14) + "px";
    p.style.height = rand(10, 18) + "px";
    p.style.background = pick(colors);
    document.body.appendChild(p);

    let x = rect.left + rect.width/2 + rand(-60,60);
    let y = rect.top + rect.height * 0.25 + rand(-10,10);
    const vx = rand(-2.2, 2.2) * 3;
    const vy = rand(-5.0, -2.4) * 3;
    const spin = rand(-14, 14);
    let t = 0;

    function step(){
      t++;
      x += vx;
      y += vy + t * 0.25;
      p.style.transform = `translate(${x}px, ${y}px) rotate(${t*spin}deg)`;
      p.style.opacity = String(Math.max(0, 1 - t/80));
      if(t > 80){ p.remove(); return; }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
}

/* ---------------------------
   12) 雪花飄落
---------------------------- */
const snowLayer = document.getElementById("snowLayer");
const btnSnow = document.getElementById("btnSnow");
let snowTimer = null;

function setSnow(on){
  btnSnow.setAttribute("aria-pressed", String(on));
  if(snowTimer) clearInterval(snowTimer);
  snowTimer = null;
  if(on) snowTimer = setInterval(() => { if(!document.hidden) spawnFlake(); }, 160);
}

function spawnFlake(){
  const f = document.createElement("div");
  f.className = "flake";
  f.style.fontSize = rand(10, 24) + "px";
  f.textContent = pick(["❄️","❅","❆","✨","·"]);
  f.style.left = rand(-5, 105) + "vw";
  f.style.opacity = rand(0.45, 0.95);
  const drift = rand(-20, 20);
  const duration = rand(6.5, 13.5);
  snowLayer.appendChild(f);

  const start = performance.now();
  function anim(now){
    const t = (now - start) / (duration * 1000);
    if(t >= 1){ f.remove(); return; }
    const y = t * 120; // vh
    const x = drift * (0.5 - 0.5*Math.cos(Math.PI*t));
    f.style.transform = `translate(${x}vw, ${y}vh) rotate(${t*180}deg)`;
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

btnSnow.addEventListener("click", () => {
  SFX.unlock(); SFX.twinkle();
  setSnow(btnSnow.getAttribute("aria-pressed") !== "true");
});

/* ---------------------------
   13) 工具函式
---------------------------- */
function rand(a,b){ return Math.random()*(b-a)+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function seededRandom(seed){
  let s = seed % 2147483647;
  if(s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647;
}
function toStagePercent(clientX, clientY){
  const rect = stage.getBoundingClientRect();
  return {
    x: clamp((clientX - rect.left) / rect.width * 100, 0, 100),
    y: clamp((clientY - rect.top) / rect.height * 100, 0, 100)
  };
}
